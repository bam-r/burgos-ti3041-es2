{% load static %}
<link rel="stylesheet" href="{% static 'catalogo/css/estilos.css' %}">

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Ferretería El Tornillo{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #222;
        }

        header {
            background-color: #1f3a5f;
            color: #ffffff;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        header p {
            margin: 4px 0 0;
            color: #cfd8e3;
            font-size: 0.95rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .resumen {
            display: flex;
            gap: 20px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }

        .resumen p {
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #1f3a5f;
            color: #ffffff;
        }

        tr.sin-stock {
            background-color: #fbe4e4;
        }

        .etiqueta-sin-stock {
            color: #a10000;
            font-weight: bold;
        }

        a {
            color: #1f3a5f;
        }

        footer {
            text-align: center;
            padding: 16px;
            margin-top: 30px;
            background-color: #1f3a5f;
            color: #cfd8e3;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ferretería El Tornillo</h1>
        <p>Herramientas y materiales para tu proyecto</p>
        <nav>
            <a href="{% url 'lista' %}">Catálogo</a>
        </nav>
    </header>

    <main>
        {% block contenido %}{% endblock %}
    </main>

    <footer>
        <p>Ferretería El Tornillo &mdash; catálogo online</p>
    </footer>
</body>
</html>
